# Nom de l'application
spring.application.name=matching-backend

# Configuration du serveur
server.port=8080

# Configuration CORS (gérée dans le contrôleur avec @CrossOrigin, mais port à vérifier ici)
# -> Tu peux ignorer ici les propriétés CORS si gérées par annotations

# Configuration des fichiers uploadés
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Répertoire pour les fichiers uploadés
app.upload.dir=uploads/

# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/matching_db
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
